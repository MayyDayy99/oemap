name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - claude/blissful-goodall-royl5x
  workflow_dispatch:

# A GITHUB_TOKEN jogosultságai a Pages-re történő deployhoz.
permissions:
  contents: read
  pages: write
  id-token: write

# Egyszerre egy deploy fusson; a folyamatban lévőt nem szakítjuk meg.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # A Pages-t egyszer kézzel kell bekapcsolni (Settings → Pages →
      # Source: GitHub Actions). A GITHUB_TOKEN deployolni tud, létrehozni a
      # Pages site-ot nem — ahhoz repo admin jog kell, lásd a README-t.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
