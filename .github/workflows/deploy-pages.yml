name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# A GITHUB_TOKEN jogosultságai a Pages-re történő deployhoz.
permissions:
  contents: read
  pages: write
  id-token: write

# Egyszerre egy deploy fusson; a folyamatban lévőt nem szakítjuk meg.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # A Pages-t egyszer kézzel kell bekapcsolni (Settings → Pages →
      # Source: GitHub Actions). A GITHUB_TOKEN deployolni tud, létrehozni a
      # Pages site-ot nem — ahhoz repo admin jog kell, lásd a README-t.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Ha egy futás a deploy lépésnél bukik el (pl. az OIDC token időtúllépése),
      # NE a hibás jobot indítsd újra: a feltöltés már lefutott, és a második
      # próbálkozás egy második "github-pages" artifactot hagy, amitől a deploy
      # elutasítja a futást. Helyette a teljes workflow-t futtasd újra, vagy
      # indítsd kézzel (Run workflow) — az saját artifactot kap.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
